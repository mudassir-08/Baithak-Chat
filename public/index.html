<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalShare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login">
    <h1>Baithak</h1>
    <p>Baithak offine chat and file sharing. No internet needed.</p>
    <input id="nameInput" maxlength="20" placeholder="Your name" autofocus>
    <button id="joinBtn">Join</button>
  </div>

  <div id="app" hidden>
     <header>
       <strong>Baithak</strong>
       <span id="count"></span>
       <button type="button" id="menuBtn">People &amp; files</button>
     </header>
    <main>
      <section id="chat">
        <div id="tabs"></div>
        <div id="messages"></div>
        <div id="uploadStatus" hidden></div>
        <form id="msgForm">
          <div id="emojiPicker" class="emoji-picker" role="group" aria-label="Quick emoji reactions" hidden>
            <div class="emoji-picker-heading">
              <strong>Quick reactions</strong>
              <span>Tap an emoji to send</span>
            </div>
            <div class="emoji-grid">
              <button type="button" class="emoji-option" data-emoji="👍" aria-label="Send thumbs up">👍</button>
              <button type="button" class="emoji-option" data-emoji="👏" aria-label="Send applause">👏</button>
              <button type="button" class="emoji-option" data-emoji="❤️" aria-label="Send heart">❤️</button>
              <button type="button" class="emoji-option" data-emoji="😂" aria-label="Send laughing face">😂</button>
              <button type="button" class="emoji-option" data-emoji="😮" aria-label="Send surprised face">😮</button>
              <button type="button" class="emoji-option" data-emoji="🎉" aria-label="Send party popper">🎉</button>
              <button type="button" class="emoji-option" data-emoji="🙏" aria-label="Send folded hands">🙏</button>
              <button type="button" class="emoji-option" data-emoji="👎" aria-label="Send thumbs down">👎</button>
            </div>
          </div>
          <button type="button" id="emojiBtn" aria-label="Open emoji reactions" aria-controls="emojiPicker" aria-expanded="false">😊</button>
          <input id="msgInput" autocomplete="off" placeholder="Message everyone">
          <button type="button" id="plusBtn" title="Send a file">+</button>
          <button type="submit" id="sendBtn">Send <span aria-hidden="true">➤</span></button>
          <input type="file" id="fileInput" hidden>
        </form>
      </section>
      <aside>
        <button type="button" id="asideClose">Close ✕</button>
        <h3>Online</h3>
        <p class="hint">Tap a name to chat privately</p>
        <ul id="users"></ul>
        <h3>Shared files</h3>
        <ul id="files"></ul>
      </aside>
    </main>
  </div>
  <div id="backdrop"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
